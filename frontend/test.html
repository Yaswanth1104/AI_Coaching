<!DOCTYPE html>
<html>
<head>
    <title>API Test</title>
</head>

<body>

    <button onclick="test()">Test API</button>

    <script>

        async function test() {

            try {

                const response = await fetch(
                    "/api/analyze",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({

                            session_id: "test-session-001",

                            message:
                                "My internet has been down since yesterday."

                        })
                    }
                );


                const data =
                    await response.json();


                console.log(data);


                alert(
                    JSON.stringify(
                        data,
                        null,
                        2
                    )
                );


            } catch (error) {

                console.error(
                    "API Error:",
                    error
                );

                alert(
                    "API Error: " +
                    error.message
                );

            }

        }

    </script>

</body>
</html>
